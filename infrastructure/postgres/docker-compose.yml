services:
  postgres:
    image: postgres:17
    container_name: shopflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow_dev_password
      POSTGRES_DB: shopflow_users
    ports:
      - "5432:5432"
    volumes:
      - shopflow-postgres-data:/var/lib/postgresql/data

volumes:
  shopflow-postgres-data: